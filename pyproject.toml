[project]
name = "credit-scoring-mlops"
version = "0.1.0"
description = "Credit scoring MLOps pipeline"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.7.2",
    "lightgbm>=4.6.0",
    "xgboost>=3.2.0",
    "catboost>=1.2.10",
    "optuna>=4.8.0",
    "optuna-dashboard>=0.20.0",
    "mlflow>=3.11.1",
    "dvc>=3.67.1",
    "shap>=0.49.1",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "scipy>=1.15.3",
    "pyyaml>=6.0.3",
    "kaggle>=1.7.4.5",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "nbformat>=5.11.1",
    "pytest",
    "ruff",
]
notebooks = [
    "jupyterlab>=4.5.6",
    "ydata-profiling>=4.18.4",
    "nbconvert>=7.17.1",
    "quarto>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: end-to-end smoke tests on synthetic data"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
